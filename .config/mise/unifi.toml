["unifi:cert:upload"]
description = "Upload, activate, and replace cert on UNIFI_HOST — removes previous certs (set CERT_FILE and KEY_FILE)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CERT_FILE="${CERT_FILE:?set CERT_FILE=/path/to/cert.pem}"
KEY_FILE="${KEY_FILE:?set KEY_FILE=/path/to/key.pem}"
COOKIE_JAR="/tmp/unifi-$$-cookies.txt"
HEADER_DUMP="/tmp/unifi-$$-headers.txt"
trap 'rm -f "${COOKIE_JAR}" "${HEADER_DUMP}"' EXIT

ADMIN_PASS=$(keychainctl get "${UNIFI_ADMIN_PASSWORD_SECRET}" 2>/dev/null) \
  || { echo "ERROR: ${UNIFI_ADMIN_PASSWORD_SECRET} not in keychain"; exit 1; }

echo "==> Logging in to ${UNIFI_HOST}..."
/usr/bin/curl -sk -c "${COOKIE_JAR}" -D "${HEADER_DUMP}" -X POST \
  -H "Content-Type: application/json" \
  -d "{\"username\":\"${UNIFI_ADMIN_USER:?set UNIFI_ADMIN_USER in .mise.portcullis.toml}\",\"password\":\"${ADMIN_PASS}\"}" \
  "https://${UNIFI_HOST}/api/auth/login" > /dev/null
TOKEN=$(awk '/TOKEN/{print $NF}' "${COOKIE_JAR}")
CSRF=$(awk -F': ' '/x-csrf-token:/{print $2}' "${HEADER_DUMP}" | tr -d '\r')
[[ -n "${TOKEN}" ]] || { echo "ERROR: login failed — check ${UNIFI_ADMIN_PASSWORD_SECRET}"; exit 1; }

CERT_NAME=$(openssl x509 -noout -subject -in "${CERT_FILE}" \
  | sed 's/.*CN=//' | sed 's/^\*\.//' | tr -d ' \r\n')

echo "==> Fetching existing certs for ${CERT_NAME}..."
OLD_IDS=$(/usr/bin/curl -sk \
  -H "Cookie: TOKEN=${TOKEN}" \
  -H "X-Csrf-Token: ${CSRF}" \
  "https://${UNIFI_HOST}/api/userCertificates" \
  | python3 -c "
import sys, json
data = json.load(sys.stdin)
certs = data if isinstance(data, list) else data.get('data', [])
for c in certs:
    if c.get('name','') == '${CERT_NAME}':
        print(c['id'])
" 2>/dev/null || true)

echo "==> Uploading cert for ${CERT_NAME}..."
RESULT=$(/usr/bin/curl -sk -X POST \
  -H "Content-Type: application/json" \
  -H "Cookie: TOKEN=${TOKEN}" \
  -H "X-Csrf-Token: ${CSRF}" \
  -d "$(python3 -c "
import json
crt = open('${CERT_FILE}').read()
key = open('${KEY_FILE}').read()
print(json.dumps({'cert': crt, 'key': key, 'name': '${CERT_NAME}'}))
")" \
  "https://${UNIFI_HOST}/api/userCertificates")

UUID=$(echo "${RESULT}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
[[ -n "${UUID}" ]] || { echo "ERROR: no cert ID — ${RESULT}"; exit 1; }

echo "==> Activating ${UUID}..."
/usr/bin/curl -sk -X PUT \
  -H "Content-Type: application/json" \
  -H "Cookie: TOKEN=${TOKEN}" \
  -H "X-Csrf-Token: ${CSRF}" \
  -d "{\"activeCertId\":\"${UUID}\"}" \
  "https://${UNIFI_HOST}/api/system" > /dev/null

if [[ -n "${OLD_IDS}" ]]; then
  while IFS= read -r old_id; do
    [[ "${old_id}" == "${UUID}" ]] && continue
    echo "==> Removing old cert ${old_id}..."
    /usr/bin/curl -sk -X DELETE \
      -H "Cookie: TOKEN=${TOKEN}" \
      -H "X-Csrf-Token: ${CSRF}" \
      "https://${UNIFI_HOST}/api/userCertificates/${old_id}" > /dev/null
  done <<< "${OLD_IDS}"
fi

echo "==> Done. Active cert: ${UUID}"
'''

# ── DNS Upsert (generic) ────────────────────────────────────────

["unifi:dns:upsert"]
description = "Idempotent portcullis DNS A-record upsert for any hostname → IP (shared by node:dns:register, gateway:dns:sync, host:identity, unifi:dns:cluster:add)"
quiet = true
usage = '''
arg "<fqdn>" help="Fully-qualified hostname to register"
arg "<ip>" help="IP address to point the A-record at"
'''
run = '''
#!/usr/bin/env bash
set -uo pipefail
FQDN="${usage_fqdn}"
IP="${usage_ip}"

UNIFI_HOST="${UNIFI_HOST:-portcullis.internal.snellarcade.org}"
UNIFI_API_KEY_SECRET="${UNIFI_API_KEY_SECRET:-PORTCUILLIS_INTERNAL_API}"
API_KEY=$(keychainctl get "${UNIFI_API_KEY_SECRET}" 2>/dev/null) \
  || { echo "ERROR: ${UNIFI_API_KEY_SECRET} not in keychain"; exit 1; }

if [[ -z "${UNIFI_SITE_ID:-}" ]]; then
  UNIFI_SITE_ID=$(/usr/bin/curl -sk \
    -H "X-API-KEY: ${API_KEY}" -H "Accept: application/json" \
    "https://${UNIFI_HOST}/proxy/network/integration/v1/sites" \
    | python3 -c "import sys,json; print(json.load(sys.stdin)['data'][0]['id'])")
fi
BASE="https://${UNIFI_HOST}/proxy/network/integration/v1/sites/${UNIFI_SITE_ID}/dns/policies"

EXISTING=$(
  /usr/bin/curl -sk \
    -H "X-API-KEY: ${API_KEY}" -H "Accept: application/json" \
    "${BASE}?limit=200" \
  | python3 -c "
import sys, json
for r in json.load(sys.stdin).get('data', []):
    if r.get('domain') == '${FQDN}':
        print(r['id'] + ' ' + r.get('ipv4Address',''))
        break
" 2>/dev/null || true)

if [[ -n "${EXISTING}" ]]; then
  EXISTING_ID="${EXISTING%% *}"; EXISTING_IP="${EXISTING##* }"
  if [[ "${EXISTING_IP}" == "${IP}" ]]; then
    echo "  ✓ ${FQDN} → ${IP} (already correct)"
    exit 0
  fi
  echo "  ~ ${FQDN}: stale (${EXISTING_IP}) → ${IP} — replacing"
  /usr/bin/curl -sk -X DELETE -H "X-API-KEY: ${API_KEY}" "${BASE}/${EXISTING_ID}" > /dev/null
fi

RESULT=$(/usr/bin/curl -sk -X POST \
  -H "X-API-KEY: ${API_KEY}" -H "Accept: application/json" -H "Content-Type: application/json" \
  -d "$(python3 -c "import json; print(json.dumps({'type':'A_RECORD','domain':'${FQDN}','ipv4Address':'${IP}','ttlSeconds':0,'enabled':True}))")" \
  "${BASE}")
ID=$(echo "${RESULT}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
if [[ -n "${ID}" ]]; then
  echo "  ✓ ${FQDN} → ${IP} (registered)"
else
  echo "  ✗ ${FQDN}: ERROR — ${RESULT}"
  exit 1
fi
'''

# ── Cluster DNS ────────────────────────────────────────────────

["unifi:dns:cluster:add"]
description = "Add wildcard A record *.CLUSTER_DOMAIN → GATEWAY_LB_IP in portcullis DNS policies (idempotent)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
DOMAIN="*.${CLUSTER_DOMAIN:?set MISE_ENV=<cluster-target> to activate a cluster profile}"
LB_IP="${GATEWAY_LB_IP:?GATEWAY_LB_IP not set — run: mise run gateway:apply}"
mise run unifi:dns:upsert "${DOMAIN}" "${LB_IP}"
'''

["unifi:dns:cluster:remove"]
description = "Remove wildcard A record *.CLUSTER_DOMAIN from portcullis DNS policies"
run = '''
#!/usr/bin/env bash
set -euo pipefail
DOMAIN="*.${CLUSTER_DOMAIN:?set MISE_ENV=<cluster-target> to activate a cluster profile}"

UNIFI_HOST="${UNIFI_HOST:-portcullis.internal.snellarcade.org}"
UNIFI_API_KEY_SECRET="${UNIFI_API_KEY_SECRET:-PORTCUILLIS_INTERNAL_API}"
API_KEY=$(keychainctl get "${UNIFI_API_KEY_SECRET}" 2>/dev/null) \
  || { echo "ERROR: ${UNIFI_API_KEY_SECRET} not in keychain"; exit 1; }

if [[ -z "${UNIFI_SITE_ID:-}" ]]; then
  UNIFI_SITE_ID=$(/usr/bin/curl -sk \
    -H "X-API-KEY: ${API_KEY}" -H "Accept: application/json" \
    "https://${UNIFI_HOST}/proxy/network/integration/v1/sites" \
    | python3 -c "import sys,json; print(json.load(sys.stdin)['data'][0]['id'])")
fi
BASE="https://${UNIFI_HOST}/proxy/network/integration/v1/sites/${UNIFI_SITE_ID}/dns/policies"

IDS=$(
  /usr/bin/curl -sk \
    -H "X-API-KEY: ${API_KEY}" -H "Accept: application/json" \
    "${BASE}?limit=200" \
  | python3 -c "
import sys, json
data = json.load(sys.stdin).get('data', [])
for r in data:
    if r.get('domain') == '${DOMAIN}':
        print(r['id'])
" 2>/dev/null || true)

if [[ -z "${IDS}" ]]; then
  echo "==> No record for ${DOMAIN} — nothing to remove."
  exit 0
fi

while IFS= read -r id; do
  echo "==> Removing ${DOMAIN} (id=${id})..."
  /usr/bin/curl -sk -X DELETE \
    -H "X-API-KEY: ${API_KEY}" \
    "${BASE}/${id}" > /dev/null
done <<< "${IDS}"
echo "==> Done."
'''

# ── Portcullis host cert ────────────────────────────────────────

["portcullis:cert:sync"]
description = "Push *.internal.snellarcade.org cert from TRUENAS_HOST to portcullis UI (secures gateway controller)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
TRUENAS_HOST="${TRUENAS_HOST:?set MISE_ENV=<cluster-target> to activate a cluster profile}"
UNIFI_HOST="${UNIFI_HOST:-portcullis.internal.snellarcade.org}"
ADMIN_PASS=$(keychainctl get "${UNIFI_ADMIN_PASSWORD_SECRET:-PORTCULLIS_ADMIN_PASSWORD}" 2>/dev/null) \
  || { echo "ERROR: ${UNIFI_ADMIN_PASSWORD_SECRET} not in keychain"; exit 1; }

echo "==> Fetching *.internal.snellarcade.org cert from ${TRUENAS_HOST}..."
CERT_JSON=$(ssh "${TRUENAS_HOST}" \
  "midclt call certificate.query '[[\"common\",\"=\",\"*.internal.snellarcade.org\"]]'" 2>/dev/null)
CRT=$(echo "${CERT_JSON}" | python3 -c "
import sys, json
data = json.load(sys.stdin)
if not data:
    sys.exit(1)
print(data[0]['certificate'])
" 2>/dev/null) || { echo "ERROR: cert not found on ${TRUENAS_HOST} — run TrueNAS ACME first"; exit 1; }
KEY=$(echo "${CERT_JSON}" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['privatekey'])")

CERT_FILE=$(mktemp /tmp/portcullis-cert-XXXXXX.pem)
KEY_FILE=$(mktemp /tmp/portcullis-key-XXXXXX.pem)
trap "rm -f ${CERT_FILE} ${KEY_FILE}" EXIT
echo "${CRT}" > "${CERT_FILE}"
echo "${KEY}" > "${KEY_FILE}"

echo "==> Logging in to ${UNIFI_HOST}..."
COOKIE_JAR=$(mktemp /tmp/unifi-cookies-XXXXXX.txt)
HEADER_DUMP=$(mktemp /tmp/unifi-headers-XXXXXX.txt)
trap "rm -f ${COOKIE_JAR} ${HEADER_DUMP} ${CERT_FILE} ${KEY_FILE}" EXIT
/usr/bin/curl -sk -c "${COOKIE_JAR}" -D "${HEADER_DUMP}" -X POST \
  -H "Content-Type: application/json" \
  -d "{\"username\":\"${UNIFI_ADMIN_USER:-totally}\",\"password\":\"${ADMIN_PASS}\"}" \
  "https://${UNIFI_HOST}/api/auth/login" > /dev/null
TOKEN=$(awk '/TOKEN/{print $NF}' "${COOKIE_JAR}")
CSRF=$(awk -F': ' '/x-csrf-token:/{print $2}' "${HEADER_DUMP}" | tr -d '\r')
[[ -n "${TOKEN}" ]] || { echo "ERROR: portcullis login failed"; exit 1; }

CERT_NAME=$(python3 -c "
import ssl, subprocess
out = subprocess.check_output(['openssl','x509','-noout','-subject','-in','${CERT_FILE}']).decode()
print(out.split('CN=')[-1].strip().lstrip('*.').rstrip())
" 2>/dev/null || echo "internal.snellarcade.org")

echo "==> Uploading cert (${CERT_NAME})..."
RESULT=$(/usr/bin/curl -sk -X POST \
  -H "Content-Type: application/json" \
  -H "Cookie: TOKEN=${TOKEN}" -H "X-Csrf-Token: ${CSRF}" \
  -d "$(python3 -c "
import json
crt = open('${CERT_FILE}').read()
key = open('${KEY_FILE}').read()
print(json.dumps({'cert': crt, 'key': key, 'name': '${CERT_NAME}'}))
")" \
  "https://${UNIFI_HOST}/api/userCertificates")
UUID=$(echo "${RESULT}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
[[ -n "${UUID}" ]] || { echo "ERROR: upload failed — ${RESULT}"; exit 1; }

echo "==> Activating ${UUID}..."
/usr/bin/curl -sk -X PUT \
  -H "Content-Type: application/json" \
  -H "Cookie: TOKEN=${TOKEN}" -H "X-Csrf-Token: ${CSRF}" \
  -d "{\"activeCertId\":\"${UUID}\"}" \
  "https://${UNIFI_HOST}/api/system" > /dev/null
echo "==> Done. portcullis now using *.internal.snellarcade.org cert."
'''

["portcullis:cert:status"]
description = "Show cert on portcullis UI and *.internal.snellarcade.org expiry on TRUENAS_HOST"
run = '''
#!/usr/bin/env bash
set -euo pipefail
TRUENAS_HOST="${TRUENAS_HOST:?set MISE_ENV=<cluster-target>}"
echo "── portcullis TLS cert ───────────────────────────"
echo | openssl s_client -connect "${UNIFI_HOST:-portcullis.internal.snellarcade.org}:443" \
  -servername "${UNIFI_HOST:-portcullis.internal.snellarcade.org}" 2>/dev/null \
  | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "  (connection failed)"
echo ""
echo "── TrueNAS *.internal.snellarcade.org cert ──────"
ssh "${TRUENAS_HOST}" \
  "midclt call certificate.query '[[\"common\",\"=\",\"*.internal.snellarcade.org\"]]'" 2>/dev/null \
  | python3 -c "
import sys, json
data = json.load(sys.stdin)
if not data: print('  (not found)'); exit()
c = data[0]
print(f\"  name:    {c['name']}\")
print(f\"  issuer:  {c.get('issuer','?')}\")
print(f\"  until:   {c.get('until','?')}\")
" 2>/dev/null || echo "  (SSH failed)"
'''
